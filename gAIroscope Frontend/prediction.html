<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>BearTeddy Predictions</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="predictionStyle.css" />
</head>
<body>
  <div class="card">
    <h1>AI-Driven Market Prediction</h1>
    <div class="prediction" id="prediction">
      <div class="label" id="label" data-text="You're Hacked">—</div>
      <div class="meta">
        <div>Direction: <strong id="direction">—</strong></div>
        <div>Confidence: <strong id="conf">—</strong></div>
        <div>Hold (mins): <strong id="hold">—</strong></div>
        <div>Last Close: <strong id="lastClose">—</strong></div>
        <div>Analysis Time: <strong id="analysisTime">—</strong></div>
      </div>

      <!-- Reasons from algorithms -->
      <div class="reasons-block">
        <h2>Model Reasons</h2>
        <ul id="pred-reasons"></ul>
      </div>

      <!-- Gemini reason -->
      <div class="ai-reason">
        <h2>AI Explanation</h2>
        <p id="pred-gemini-reason">—</p>
      </div>
    </div>
    <div class="footer">Powered by gAIroscope</div>
  </div>

  <script src="predictionScript.js"></script>
  <!-- Matrix effect overlay -->
<div class="matrix" id="matrix"></div>
</body>
</html>
